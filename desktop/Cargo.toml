[package]
name = "softoxide-calculator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calculator-core = { path = "../core" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "accesskit"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "x11", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["wgpu"] }
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "wgsl"] }

# Compile and check the Windows renderer configuration in tests on other hosts too.
[dev-dependencies]
eframe = { version = "0.33", default-features = false, features = ["wgpu"] }
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "wgsl"] }
